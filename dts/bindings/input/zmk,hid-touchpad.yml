description: >
  I2C HID Touchpad passthrough driver. Forwards raw HID reports from an
  I2C HID touchpad to USB and BLE host interfaces.

compatible: "zmk,hid-touchpad"

include: [i2c-device.yaml]

properties:
  dr-gpios:
    type: phandle-array
    description: Interrupt (data ready) pin for the touchpad

  hid-descriptor-register:
    type: int
    required: true
    description: I2C register address for the HID descriptor (e.g. 0x20)

  report-descriptor:
    type: uint8-array
    required: true
    description: Full HID report descriptor blob

  ble-report-descriptor:
    type: uint8-array
    description: >
      Report map to serve over BLE instead of report-descriptor. A GATT
      attribute value is limited to 512 bytes, and a host may stop reading
      the Report Map there, so a longer descriptor needs a BLE copy: the
      same reports, described identically, with collections BLE doesn't
      need left out. scripts/ble_report_map.py writes and checks it.

  mouse-input-report-id:
    type: int
    required: true
    description: Report ID for mouse input reports (e.g. 1)

  ptp-input-report-id:
    type: int
    required: true
    description: Report ID for PTP (precision touchpad) input reports (e.g. 4)

  mouse-input-report-size:
    type: int
    required: true
    description: Size in bytes of mouse input report data (excluding report ID)

  ptp-input-report-size:
    type: int
    required: true
    description: Size in bytes of PTP input report data (excluding report ID)

  feature-report-ids:
    type: array
    required: true
    description: List of feature report IDs exposed by this touchpad

  feature-report-sizes:
    type: array
    required: true
    description: >
      Data size in bytes (excluding the report ID) of each feature report,
      parallel to feature-report-ids. Bounds the I2C read a GET_REPORT
      clocks, so a 1-byte report doesn't cost a full-buffer transfer.

  ble-feature-report-ids:
    type: array
    description: >
      Feature reports to expose over BLE (default: feature-report-ids). Each
      must also be in feature-report-ids. Set it when ble-report-descriptor
      leaves some out.

  # PixArt pads only, written over vendor feature report 0x43. Each value
  # overrides the user register the firmware's parameter section loads at
  # pad boot; leave a property out to keep the firmware's value.

  pixart,max-report-rate:
    type: int
    description: >
      Run-mode report rate to request, in Hz, 1-255 (user bank 0
      MAX_REPORT_RATE, 0x12). Daisy firmware 0x1204 ships 140, earlier
      releases 130. The pad may deliver less under noise avoidance
      (OBS_REPORT_RATE, 0x10/0x11).

  pixart,rest1-frame-rate:
    type: int
    description: >
      Frame rate in Hz, 1-255, of the first idle mode, entered after
      REST1_DS (0x18/0x19, 50 ms units) without touch (user bank 0
      REST1_FRAME_RATE, 0x1c). Daisy firmware ships 20. Derived from the
      slow oscillator, so the real rate may be off by up to 50%.

  pixart,rest2-frame-rate:
    type: int
    description: >
      Frame rate in Hz, 1-255, of the second, deeper idle mode, entered
      after a further REST2_DS (0x1a/0x1b) (user bank 0 REST2_FRAME_RATE,
      0x1d). Bounds how long the first touch after a long idle takes to
      register. Daisy firmware 0x1203+ ships 20, 0x1202 shipped 4.
